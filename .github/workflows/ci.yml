name: CI

# Manual only for now: GitHub Actions minutes are limited, checks run on the dev machine.
# To re-enable, add back `pull_request:` and `push: branches: [main]`.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump the engine only in a dedicated PR, together with project.godot features.
  GODOT_VERSION: "4.7.2"
  # SHA512-SUMS.txt of https://github.com/godotengine/godot/releases/tag/4.7.2-stable
  GODOT_SHA512_LINUX: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_SHA512_WINDOWS: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993
  GODOT_SHA512_TEMPLATES: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
  GDTOOLKIT_VERSION: "4.5.0"

jobs:
  lint:
    name: Lint (gdtoolkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      - name: gdlint
        run: gdlint .
      - name: gdformat
        run: gdformat --check $(git ls-files '*.gd' ':!:addons/**')
      - name: Catalog exporter tests
        run: python -m unittest discover -s tools/catalog/tests -t .
      - name: Catalog data matches catalog.json
        run: python -m tools.catalog.export --check

  test:
    name: Import and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512-linux: ${{ env.GODOT_SHA512_LINUX }}
          editor-sha512-windows: ${{ env.GODOT_SHA512_WINDOWS }}
      - name: Import project
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: tools/ci/godot_checked.sh --headless --import
      - name: GUT tests
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          mkdir -p .ci
          tools/ci/godot_checked.sh --headless -s addons/gut/gut_cmdln.gd -gjunit_xml_file=res://.ci/gut_results.xml
      - name: Run main scene
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: tools/ci/godot_checked.sh --headless --quit-after 120
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gut-results-${{ matrix.os }}
          path: .ci/gut_results.xml
          if-no-files-found: ignore

  export:
    name: Export builds
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512-linux: ${{ env.GODOT_SHA512_LINUX }}
          editor-sha512-windows: ${{ env.GODOT_SHA512_WINDOWS }}
          templates: "true"
          templates-sha512: ${{ env.GODOT_SHA512_TEMPLATES }}
      - name: Import project
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: tools/ci/godot_checked.sh --headless --import
      - name: Export Linux and Windows
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          mkdir -p build/linux build/windows
          tools/ci/godot_checked.sh --headless --export-release "Linux" build/linux/pogranichie.x86_64
          tools/ci/godot_checked.sh --headless --export-release "Windows" build/windows/pogranichie.exe
      - name: Smoke-run the Linux build
        run: |
          out="$(build/linux/pogranichie.x86_64 --headless --quit-after 60 2>&1)"
          echo "$out"
          grep -q "Main scene ready" <<<"$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pogranichie-linux-${{ github.sha }}
          path: build/linux/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pogranichie-windows-${{ github.sha }}
          path: build/windows/
          if-no-files-found: error
